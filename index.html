<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/emblem.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02443a" />
    <title>منصة مديرية التخطيط والإحصاء — وزارة الطوارئ وإدارة الكوارث</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('medsp-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- إعدادات وقت التشغيل: يولّدها السيرفر من ملف .env (انظر DEPLOY.md) -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
