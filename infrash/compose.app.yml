# Standalone deployment file. The repository's existing Compose file is preserved.
services:
  medsp:
    image: ${APP_IMAGE:?Set by infrash}
    pull_policy: never
    restart: unless-stopped
    init: true
    env_file:
      - ${MEDSP_RUNTIME_ENV:?Set by infrash}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "${MEDSP_BIND_IP:-127.0.0.1}:${MEDSP_HOST_PORT:?Set by infrash}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(async r=>{if(!r.ok||(await r.text()).trim()!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
