# Nginx أمام منصة مديرية التخطيط والإحصاء
# انسخه إلى /etc/nginx/sites-available/medsp ثم فعّله، وعدّل النطاق ومسار الشهادة.

server {
    listen 80;
    server_name stats.example.gov.sy;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stats.example.gov.sy;

    ssl_certificate     /etc/ssl/medsp/fullchain.pem;
    ssl_certificate_key /etc/ssl/medsp/privkey.pem;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
